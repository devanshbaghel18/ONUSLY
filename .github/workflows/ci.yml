name: ONUSLY CI

on:
  push:
    branches: [ main, himanshu ]
  pull_request:
    branches: [ main, himanshu ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Core (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify Go modules
        run: go mod verify

      - name: Run go vet
        run: go vet ./internal/... ./cmd/...

      - name: Run Backend Unit Tests
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_REGION: us-east-1
        run: go test -v ./internal/... ./cmd/server

      - name: Build Server Binary
        run: go build -v -o server ./cmd/server

  frontend:
    name: Web Frontend (React & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test -- --run

      - name: Build Vite Production Bundle
        run: npm run build

  extension:
    name: Browser Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Extension Tests (101 Test Cases)
        run: npm test

      - name: Package Extension Artifact
        run: |
          mkdir -p ../dist-extension
          zip -r ../dist-extension/onusly-extension-bundle.zip . -x "tests/*" ".git*" "node_modules/*"

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onusly-extension-bundle
          path: dist-extension/onusly-extension-bundle.zip
          retention-days: 14

