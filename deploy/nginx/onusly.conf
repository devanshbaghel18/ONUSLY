# ==============================================================================
# ONUSLY Production Nginx Reverse Proxy Configuration
# Handles HTTP REST endpoints, SPA frontend routing, and WebSocket upgrades.
# ==============================================================================

# Map for WebSocket Connection upgrade header
# Automatically upgrades when $http_upgrade is present, closes cleanly otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream onusly_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name onusly.app www.onusly.app localhost;

    # Maximum allowed payload size for proof submissions and images
    client_max_body_size 25M;

    # Gzip compression for high-performance static asset delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2;

    # --------------------------------------------------------------------------
    # 1. Real-Time WebSocket Gateway (/ws and /ws/)
    # Critical: Passes Upgrade & Connection headers so WebSocket handshake succeeds.
    # --------------------------------------------------------------------------
    location /ws {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Client Identity Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for persistent keep-alive WebSocket connections (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Disable proxy buffering for instant real-time frame dispatch
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 2. REST API Routes (/goals, /auth, /health, etc.)
    # --------------------------------------------------------------------------
    location ~ ^/(goals|auth|health) {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 3. Frontend Static Assets & SPA Fallback (Vite production build)
    # --------------------------------------------------------------------------
    location / {
        root /var/www/onusly/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets with hash in filename
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
