# ==============================================================================
# ONUSLY Production Nginx Reverse Proxy Configuration
# Architecture:
#   Client -> HTTPS -> Cloudflare (Full Strict) -> EC2 Nginx :443 -> Go Backend :8080
# Domains:
#   api.onusly.com (Central Go REST API, WebSocket Gateway, Legacy CRX Downloads)
#   onusly.com, www.onusly.com, onusly.app (SPA Web App Frontend)
# ==============================================================================

# Map for WebSocket Connection upgrade header
# Automatically upgrades when $http_upgrade is present, closes cleanly otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Distinguish browser HTML page navigations from JS/API fetches or Bearer-authenticated calls.
# Top-level GET/HEAD browser loads on SPA routes (e.g. F5 on /goals or /approvals) get /index.html.
map "$request_method:$http_accept:$http_authorization" $onusly_serve_spa {
    default 0;
    "~^(?:GET|HEAD):.*text/html.*:$" 1;
}

upstream onusly_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. Plain HTTP (Port 80) Listener
# Redirects all HTTP requests to HTTPS (301 Moved Permanently)
# Preserves ACME challenge path for Let's Encrypt / Certbot renewal if used
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.onusly.com onusly.com www.onusly.com onusly.app www.onusly.app onusly.duckdns.org localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Production API Subdomain: api.onusly.com (HTTPS Port 443)
# Dedicated vhost terminating TLS for Cloudflare Full (strict) mode.
# Proxies all REST API endpoints, real-time WebSockets, and legacy CRX downloads.
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.onusly.com;

    # SSL / TLS Certificate Configuration (Cloudflare Origin CA or Public CA)
    ssl_certificate /etc/ssl/onusly/api.onusly.com.pem;
    ssl_certificate_key /etc/ssl/onusly/api.onusly.com.key;

    # Modern TLS Security Policies (TLS 1.2 and TLS 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!CAMELLIA:!AES128;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_API:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Maximum allowed payload size for proof submissions, images, logs (aligned with Go 50MB limit)
    client_max_body_size 50M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression for high-performance payload delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2;

    # Real-Time WebSocket Gateway (/ws and /ws/)
    location /ws {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    # Restrict internal DynamoDB warmup and Prometheus metrics endpoints to loopback only
    location = /health/warm {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve static binary downloads directly from disk with extended proxy fallback timeout
    location ^~ /downloads/ {
        root /var/www/onusly/frontend/dist;
        types {
            application/x-chrome-extension            crx;
            application/vnd.android.package-archive   apk;
            application/zip                           zip;
            application/xml                           xml;
            application/vnd.microsoft.portable-executable exe;
        }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @api_backend_downloads;
    }

    location @api_backend_downloads {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # All API Endpoints (/health, /goals, /enforcement, /uploads, etc.)
    location / {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 3. Web App Server Block: onusly.com, www.onusly.com, onusly.app (HTTPS Port 443)
# Serves Vite SPA production bundle and proxies local API routes.
# ------------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name onusly.com www.onusly.com onusly.app www.onusly.app onusly.duckdns.org localhost;

    ssl_certificate /etc/ssl/onusly/api.onusly.com.pem;
    ssl_certificate_key /etc/ssl/onusly/api.onusly.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!CAMELLIA:!AES128;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_WEB:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2;

    # Real-Time WebSocket Gateway
    location /ws {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    # Restrict internal DynamoDB warmup and Prometheus metrics endpoints to loopback only
    location = /health/warm {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proof uploads MUST always proxy to the authenticated Go handler regardless of file extension or Accept header
    location ^~ /uploads/ {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Static downloads (extension zips/crx, installer exe, android apk, updates.xml) served directly by Nginx
    location ^~ /downloads/ {
        root /var/www/onusly/frontend/dist;
        types {
            application/x-chrome-extension            crx;
            application/vnd.android.package-archive   apk;
            application/zip                           zip;
            application/xml                           xml;
            application/vnd.microsoft.portable-executable exe;
        }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @web_backend_downloads;
    }

    location @web_backend_downloads {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # OAuth browser redirects and health checks must always proxy to Go
    location ^~ /auth/google {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /auth/logout {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Hashed Vite build assets cached immutably (scoped strictly to /assets/)
    location ^~ /assets/ {
        root /var/www/onusly/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # API Routes shared with SPA paths: top-level browser HTML loads fall back to SPA /index.html;
    # XHR/fetch/Bearer calls proxy to Go backend.
    location ~ ^/(goals|auth|chat|users|notifications|enforcement|friends|communities|wellbeing|approvals) {
        if ($onusly_serve_spa = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Frontend Static Assets & SPA Fallback (Vite production build)
    location / {
        root /var/www/onusly/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src 'self' https://accounts.google.com; connect-src 'self' https://api.onusly.com wss://api.onusly.com https://onusly.duckdns.org wss://onusly.duckdns.org https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleusercontent.com https://api.onusly.com https://onusly.duckdns.org; object-src 'none'; base-uri 'self'" always;
    }
}
