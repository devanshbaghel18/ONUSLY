# ==============================================================================
# ONUSLY Production Nginx Reverse Proxy Configuration
# Architecture:
#   Client -> HTTPS -> Cloudflare (Full Strict) -> EC2 Nginx :443 -> Go Backend :8080
# Domains:
#   api.onusly.com (Central Go REST API, WebSocket Gateway, Legacy CRX Downloads)
#   onusly.com, www.onusly.com, onusly.app (SPA Web App Frontend)
# ==============================================================================

# Map for WebSocket Connection upgrade header
# Automatically upgrades when $http_upgrade is present, closes cleanly otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream onusly_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. Plain HTTP (Port 80) Listener
# Redirects all HTTP requests to HTTPS (301 Moved Permanently)
# Preserves ACME challenge path for Let's Encrypt / Certbot renewal if used
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.onusly.com onusly.com www.onusly.com onusly.app www.onusly.app localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Production API Subdomain: api.onusly.com (HTTPS Port 443)
# Dedicated vhost terminating TLS for Cloudflare Full (strict) mode.
# Proxies all REST API endpoints, real-time WebSockets, and legacy CRX downloads.
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.onusly.com;

    # SSL / TLS Certificate Configuration (Cloudflare Origin CA or Public CA)
    ssl_certificate /etc/ssl/onusly/api.onusly.com.pem;
    ssl_certificate_key /etc/ssl/onusly/api.onusly.com.key;

    # Modern TLS Security Policies (TLS 1.2 and TLS 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!CAMELLIA:!AES128;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_API:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Maximum allowed payload size for proof submissions, images, logs
    client_max_body_size 25M;

    # Gzip compression for high-performance payload delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2;

    # Real-Time WebSocket Gateway (/ws and /ws/)
    location /ws {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    # All API Endpoints (/health, /goals, /enforcement, /downloads, etc.)
    location / {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 3. Web App Server Block: onusly.com, www.onusly.com, onusly.app (HTTPS Port 443)
# Serves Vite SPA production bundle and proxies local API routes.
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name onusly.com www.onusly.com onusly.app www.onusly.app localhost;

    ssl_certificate /etc/ssl/onusly/api.onusly.com.pem;
    ssl_certificate_key /etc/ssl/onusly/api.onusly.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!CAMELLIA:!AES128;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_WEB:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2;

    # Real-Time WebSocket Gateway
    location /ws {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    # REST API Routes & Omaha Downloads
    location ~ ^/(goals|auth|health|chat|users|notifications|enforcement|friends|communities|downloads) {
        proxy_pass http://onusly_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Frontend Static Assets & SPA Fallback (Vite production build)
    location / {
        root /var/www/onusly/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
